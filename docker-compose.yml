name: web-ui-ssr-experiment

services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=todos
      - POSTGRES_USER=todos
      - POSTGRES_PASSWORD=todos
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U todos -d todos']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '127.0.0.1:5432:5432'

  business-logic:
    build:
      context: .
      dockerfile: services/business-logic-java/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/todos
      - DATABASE_USERNAME=todos
      - DATABASE_PASSWORD=todos
    ports:
      - '127.0.0.1:3001:3001'

  web-ui-ssr:
    build:
      context: .
      dockerfile: services/web-ui-ssr/Dockerfile
      args:
        PUBLIC_BUSINESS_LOGIC_URL: 'http://localhost:3001'
    depends_on:
      - business-logic
    environment:
      - BUSINESS_LOGIC_URL=http://business-logic:3001
    ports:
      - '127.0.0.1:3000:3000'

volumes:
  postgres-data:
