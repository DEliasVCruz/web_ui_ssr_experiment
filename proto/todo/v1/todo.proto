edition = "2023";

package todo.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option features.field_presence = IMPLICIT;

// Todo represents a single todo item.
message Todo {
  // Unique identifier for the todo.
  string id = 1;
  // Title of the todo.
  string title = 2;
  // Whether the todo has been completed.
  bool completed = 3;
  // Timestamp when the todo was created.
  google.protobuf.Timestamp created_at = 4;
  // Timestamp when the todo was last updated.
  google.protobuf.Timestamp updated_at = 5;
  // Free-form details/notes for the todo. Explicit presence: the field is unset
  // when the todo has no details (the persisted column is NULL), and set —
  // including to an empty string — when details were provided (an empty string
  // means the content was explicitly cleared). Consumers distinguish
  // "never set" (has_details == false) from "cleared" (has_details == true,
  // value == "").
  string details = 6 [features.field_presence = EXPLICIT];
}

// ListTodosRequest is the request message for ListTodos.
message ListTodosRequest {}

// ListTodosResponse is the response message for ListTodos.
message ListTodosResponse {
  // The list of todos.
  repeated Todo todos = 1;
}

// GetTodoRequest is the request message for GetTodo.
message GetTodoRequest {
  // The ID of the todo to retrieve. Note: string.uuid accepts uppercase hex
  // too (case-insensitive); server-generated ids are lowercase UUIDv7, so an
  // uppercase id passes validation but misses at lookup (not_found).
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// GetTodoResponse is the response message for GetTodo.
message GetTodoResponse {
  // The requested todo.
  Todo todo = 1;
}

// CreateTodoRequest is the request message for CreateTodo.
message CreateTodoRequest {
  // The title for the new todo. Must be non-empty and at most 100 characters.
  string title = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  // Optional details for the new todo. Explicit presence: unset means "no
  // details" (persisted as NULL); a provided value — including an empty string —
  // is stored verbatim. No min_len (empty is legal, unlike title); at most
  // 1000 characters (mirrors the title max_len style, sized for a notes field).
  string details = 2 [
    features.field_presence = EXPLICIT,
    (buf.validate.field).string = {max_len: 1000}
  ];
  // Optional client-supplied id for the new todo (idempotent create). Explicit
  // presence: when UNSET the server mints a lowercase UUIDv7 (the default, and
  // the only path the current UI exercises); when SET the server persists the
  // supplied id verbatim. The same uuid rule GetTodoRequest.id uses validates
  // it (case-insensitive; server-minted ids are lowercase — see GetTodoRequest).
  //
  // Idempotency contract — FIRST-WRITE-WINS, never an upsert: this id is the
  // replay key for the offline mutation queue (web_ui_ssr_experiment-1w9). If a
  // create arrives whose id already exists (a queue entry re-sent after a crash
  // mid-flush), the server returns the EXISTING row as an ordinary 200 success
  // and IGNORES any payload difference on the duplicate (a different title on the
  // replay does NOT overwrite the stored one). This is the honest at-least-once
  // replay semantic: re-sending the identical queued entry must be a no-op, not a
  // mutation. created_at/updated_at stay server-minted (server truth for
  // ordering), so a replayed create never disturbs list order either.
  //
  // Security note: the uuid protovalidate rule keeps arbitrary text out of the id
  // column, and first-write-wins means a client cannot mutate an existing row by
  // colliding its id (the collision is a read, not a write). Owner-scoping of ids
  // across tenants is a documented FUTURE concern — this is a single-user
  // experiment today, so any client may supply any well-formed uuid.
  string id = 3 [
    features.field_presence = EXPLICIT,
    (buf.validate.field).string.uuid = true
  ];
}

// CreateTodoResponse is the response message for CreateTodo.
message CreateTodoResponse {
  // The newly created todo.
  Todo todo = 1;
}

// UpdateTodoRequest is the request message for UpdateTodo.
message UpdateTodoRequest {
  // The ID of the todo to update.
  string id = 1 [(buf.validate.field).string.uuid = true];
  // The new title, if updating. When set, must be non-empty and at most
  // 100 characters; the rule is skipped when the field is unset (explicit
  // presence).
  string title = 2 [
    features.field_presence = EXPLICIT,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 100
    }
  ];
  // The new completed status, if updating.
  bool completed = 3 [features.field_presence = EXPLICIT];
  // The new details, if updating. Explicit presence distinguishes "not provided"
  // (unset — the details are left unchanged) from "provided" (set — the details
  // are overwritten, including with an empty string, which clears the content).
  // When set, at most 1000 characters; no min_len, so clearing via "" is legal.
  // The rule is skipped when the field is unset.
  string details = 4 [
    features.field_presence = EXPLICIT,
    (buf.validate.field).string = {max_len: 1000}
  ];
}

// UpdateTodoResponse is the response message for UpdateTodo.
message UpdateTodoResponse {
  // The updated todo.
  Todo todo = 1;
}

// DeleteTodoRequest is the request message for DeleteTodo.
message DeleteTodoRequest {
  // The ID of the todo to delete.
  string id = 1 [(buf.validate.field).string.uuid = true];
}

// DeleteTodoResponse is the response message for DeleteTodo.
message DeleteTodoResponse {}

// TodoService provides CRUD operations for todo items.
service TodoService {
  // ListTodos returns all todos. Read-only: marked NO_SIDE_EFFECTS so Connect
  // clients may issue it as an idempotent HTTP GET (cacheable, side-effect-free).
  rpc ListTodos(ListTodosRequest) returns (ListTodosResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // GetTodo returns a single todo by ID. Read-only: marked NO_SIDE_EFFECTS so
  // Connect clients may issue it as an idempotent HTTP GET.
  rpc GetTodo(GetTodoRequest) returns (GetTodoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // CreateTodo creates a new todo.
  rpc CreateTodo(CreateTodoRequest) returns (CreateTodoResponse);
  // UpdateTodo updates an existing todo.
  rpc UpdateTodo(UpdateTodoRequest) returns (UpdateTodoResponse);
  // DeleteTodo deletes a todo by ID.
  rpc DeleteTodo(DeleteTodoRequest) returns (DeleteTodoResponse);
}
