---
id: no-realtime-websockets-java
language: java
severity: error
message: >-
  WebSockets / realtime transport are OUT OF SCOPE for this experiment
  (AGENTS.md "Out of scope"). The business-logic backend speaks Connect/gRPC
  unary only — do not import Jakarta or Helidon WebSocket support.
files:
  - services/business-logic-java/src/main/java/**/*.java
  - packages/java/*/src/main/java/**/*.java
rule:
  kind: import_declaration
  regex: ^import\s+(jakarta\.websocket|io\.helidon\.webserver\.websocket|io\.helidon\.websocket)
