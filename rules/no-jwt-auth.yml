---
id: no-jwt-auth-java
language: java
severity: error
message: >-
  Real authentication / JWT middleware is OUT OF SCOPE for this experiment
  (AGENTS.md "Out of scope"). Do not import a JWT/auth library (io.jsonwebtoken,
  com.auth0.jwt, com.nimbusds) — flag the requirement instead.
files:
  - services/business-logic-java/src/main/java/**/*.java
  - packages/java/*/src/main/java/**/*.java
rule:
  kind: import_declaration
  regex: ^import\s+(io\.jsonwebtoken|com\.auth0\.jwt|com\.nimbusds\.(jwt|jose))
