# Agreement (AGENTS.md "Working agreements"):
#   "Keep the two services honest. The rendering server must not own data or
#    proxy post-hydration traffic. The business-logic server must be the only
#    SQLite client."
# The rendering server (web-ui-ssr) owns no data, so it must never open a SQLite
# database. Importing a SQLite driver there is the structural signal that the
# renderer has started owning persistence — exactly the leak this forbids.
#
# Not covered elsewhere: the Java-side "SQLite lives in TodoDb/TodoRepository"
# rule is enforced by ArchUnit inside the Java service; nothing stops the TS
# renderer from importing bun:sqlite. This rule closes that cross-service gap.
id: renderer-owns-no-data-ts
language: typescript
severity: error
message: >-
  The rendering server owns no data — it must not open a SQLite database.
  Importing a SQLite driver (bun:sqlite / node:sqlite / better-sqlite3) here
  violates "the business-logic server must be the only SQLite client" (AGENTS.md).
  Fetch data over the Connect RPC transport instead.
files:
  - services/web-ui-ssr/src/**/*.ts
rule:
  kind: string_fragment
  regex: ^(bun:sqlite|node:sqlite|better-sqlite3|sqlite3)$
  inside:
    kind: import_statement
    stopBy: end

