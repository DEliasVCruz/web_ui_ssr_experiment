# Docker profile — activated in the container image via ENV CONFIG_PROFILES=docker
# (see services/business-logic-java/Dockerfile). Layered on top of application.yaml.
#
# In the container the SQLite database lives on the mounted `sqlite-data` volume
# (docker-compose.yml mounts it at /data), so the docker-environment default DB
# path differs from the local ./data/todos.db default. This is exactly the kind
# of environment-varying service configuration that belongs in a config file
# rather than being hard-coded in the compose/env layer.
#
# Precedence note: this overrides only the DEFAULT of the same ${DATABASE_PATH:...}
# expression the base file uses (not a bare literal), so an explicit DATABASE_PATH
# environment variable still wins — compose or an operator can always repoint the
# database without touching the image. (A bare literal here would silently sever
# the DATABASE_PATH override, since avaje-config's automatic env key for db.path
# is DB_PATH, not DATABASE_PATH.)
db:
  path: ${DATABASE_PATH:/data/todos.db}
