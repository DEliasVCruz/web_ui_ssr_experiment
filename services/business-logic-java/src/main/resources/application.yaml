# business-logic-java service configuration (avaje-config).
#
# This file holds the DEFAULTS for every environment-varying knob. avaje-config
# loads it from the classpath at startup (Config.asConfiguration()), then applies
# overrides in precedence order (highest first):
#   1. matching system property         (-Dserver.port=9000)
#   2. matching environment variable    (SERVER_PORT / DATABASE_PATH / ...)
#   3. the ${VAR:default} expressions below, and profile files
#   4. these file defaults
#
# The ${VAR:default} expressions below preserve the service's historical env-var
# names verbatim, so docker-compose and the devenv ci:e2e task keep injecting
# PORT / DATABASE_PATH exactly as before — those values now flow through
# avaje-config instead of raw System.getenv() in Java.
#
# Profiles: set CONFIG_PROFILES=<name> (or -Dconfig.profiles=<name>) to layer
# application-<name>.yaml on top of these defaults. See application-docker.yaml.
server:
  # HTTP listen port for the Helidon WebServer. Historical override: PORT.
  port: ${PORT:3001}

db:
  # SQLite database file path. Historical override: DATABASE_PATH.
  path: ${DATABASE_PATH:./data/todos.db}
