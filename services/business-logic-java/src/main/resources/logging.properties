# Framework & out-of-request logging for business-logic-java (task iq2.2).
#
# Everything the JVM logs OUTSIDE a request — Helidon startup, Flyway migrations,
# HikariCP pool lifecycle, avaje-config/-inject wiring, shutdown — is emitted as
# ONE JSON object per line on stdout, the same stream and the same naming
# convention as the per-request wide events (docs/wide-events.md). The two are
# separate streams that share key names where they overlap (timestamp), NOT one
# schema. See docs/logging.md for the full rationale.
#
# This file is read by Helidon's JUL logging provider (io.helidon.logging.jul,
# an explicit runtime dependency): io.helidon.logging.common.LogConfig
# .configureRuntime() — called first thing in Main.start(), before the Flyway
# migrations run during the DI-graph build — loads it from the classpath. JUL
# itself does NOT auto-read a classpath logging.properties; Helidon's provider
# does. (Unit tests that boot the server without going through Main.start() keep
# the JVM-default JUL config; a logging-test.properties, preferred by the
# provider, could override per-test but none is needed here.)

# Root handler: Helidon's console handler writes to System.out (NOT stderr, so
# it shares the wide-event stream) and sets itself to Level.ALL, delegating level
# filtering to the loggers below.
handlers=io.helidon.logging.jul.HelidonConsoleHandler

# The handler defaults to the plain-text HelidonFormatter; switch it to the JSON
# formatter explicitly (the handler only honours this if the property is set).
io.helidon.logging.jul.HelidonConsoleHandler.formatter=io.helidon.logging.jul.HelidonJsonFormatter

# JSON field set (SimpleFormatter-style conversions; comma separates fields, the
# first colon of each field separates jsonName:format). Blank values are OMITTED
# by the formatter, so `exception` is present only on records that carry a
# Throwable, and the `thread` field is dropped entirely: request work runs on
# UNNAMED virtual threads, so a thread value would be blank/empty noise.
#
# Key alignment with the wide-event schema (docs/wide-events.md):
#   * timestamp - ISO-like date-time. Rendered WITH the numeric UTC offset
#     (%1$tz -> e.g. -0500 / +0000) rather than a hard-coded 'Z': the formatter
#     builds the value from the JVM's default zone, so a literal 'Z' would LIE
#     whenever the JVM is not on UTC (the wide-event stream uses java.time.Instant
#     and is always real-UTC 'Z'; framework logs stay honest about their zone
#     instead of pretending). NOTE: %tz emits the BASIC (colon-less) ±hhmm
#     offset, so this is NOT strict RFC-3339 (strict parsers reject it);
#     consumers must normalize — see docs/logging.md. Both timestamp styles
#     resolve to the same absolute instant.
#   * level / message - framework-log-only fields (the wide event is structured
#     and carries neither).
#   * logger - the JUL logger name (emitting class), the framework-log analogue
#     of the wide event's `component`; deliberately NOT named `component`, whose
#     wide-event value is the SERVICE identity, not a class name.
#   * exception - flat printed stack trace; distinct from the wide event's nested
#     `error` object, hence a distinct key (no false alignment).
io.helidon.logging.jul.HelidonJsonFormatter.fields=timestamp:%1$tFT%1$tT.%1$tL%1$tz,level:%4$s,message:%5$s,logger:%3$s,exception:%6$s

# Level policy: INFO for everything. Loggers do the filtering (the handler is at
# ALL). INFO captures Flyway migration progress, Hikari pool start/stop, Helidon
# startup and the app's own startup line without per-connection DEBUG spam.
.level=INFO

# jOOQ prints a large ASCII-art banner and a "tip of the day" at INFO on first
# use (logger org.jooq.Constants) — pure vendor noise with no operational value.
# Raise its floor to WARNING so those are dropped while real jOOQ warnings (e.g.
# the dialect version-mismatch note, logged by a different jOOQ logger) still
# surface as JSON.
org.jooq.Constants.level=WARNING
