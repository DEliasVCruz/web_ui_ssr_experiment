version: v2
plugins:
  - local: protoc-gen-es
    out: packages/rpc/gen
    opt: target=ts
    # todo.proto imports buf/validate/validate.proto (protovalidate constraints);
    # the generated todo_pb.ts references its file descriptor, so the dep's
    # *_pb.ts must be emitted too (well-known types stay excluded and keep
    # resolving from @bufbuild/protobuf/wkt).
    include_imports: true
  - local: protoc-gen-connect-query
    out: packages/rpc/gen
    opt: target=ts
  # Java codegen for services/business-logic-java (gitignored output).
  # Both plugins come from devenv (nixpkgs): protoc (builtin java) and
  # protoc-gen-grpc-java, so generation is fully offline and reproducible.
  - protoc_builtin: java
    out: services/business-logic-java/generated-sources/protobuf
  - local: protoc-gen-grpc-java
    out: services/business-logic-java/generated-sources/grpc
