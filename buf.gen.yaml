version: v2
plugins:
  # The TS plugins exclude buf.validate: protovalidate constraints are enforced
  # server-side only (business-logic-java), and excluding the extension strips
  # the buf.validate.* options AND the buf/validate/validate.proto import from
  # the descriptors fed to these plugins. Without this, todo_pb.ts gains a
  # runtime (non-tree-shakeable) import of the ~71 kB validate.proto descriptor,
  # which measurably bloated the web-ui-ssr browser entry chunk
  # (27.1 kB -> 98.5 kB raw, 10.7 kB -> 23.6 kB gzip).
  - local: protoc-gen-es
    out: packages/rpc/gen
    opt: target=ts
    exclude_types:
      - buf.validate
  - local: protoc-gen-connect-query
    out: packages/rpc/gen
    opt: target=ts
    exclude_types:
      - buf.validate
  # JSON Schema codegen (bufbuild/protoschema-plugins protoc-gen-jsonschema,
  # provisioned from source via nix/devshell.nix). This one DELIBERATELY keeps
  # buf.validate: the whole point is to carry the constraints (string min_len /
  # max_len -> minLength / maxLength) into JSON Schema, which the frontend form
  # validator is derived from (packages/rpc/gen — gitignored). target=json emits
  # one camelCase `*.jsonschema.json` per message; scripts/wrap-jsonschema.ts then
  # turns the request schemas the form consumes into typed `as const` TS modules.
  - local: protoc-gen-jsonschema
    out: packages/rpc/gen/jsonschema
    opt: target=json
  # Java codegen for services/business-logic-java (gitignored output).
  # Both plugins come from the nix dev shell (nixpkgs): protoc (builtin java) and
  # protoc-gen-grpc-java, so generation is fully offline and reproducible.
  - protoc_builtin: java
    out: services/business-logic-java/generated-sources/protobuf
  - local: protoc-gen-grpc-java
    out: services/business-logic-java/generated-sources/grpc
